baseurl: /site

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"
excerpt_separator: <!--more-->

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Anton"
      image: "assets/images/profixel_orange_512.png"
      alt: "A pixel art style portrait of me, Anton."
      tags: [news]
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
