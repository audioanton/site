<div class="card-post shadowed border-black bg-color-green" data-url ="{{ include.post.url | relative_url }}">
        <h3>
            {{ include.post.title }}
        </h3>
        <div class="card-row">
            <img src="{{ include.post.image | relative_url }}" class="">
            {{ include.post.excerpt }}
        </div>
</div>
